server:
  port: ${PORT:8088}

spring:
  application:
    name: kuet-management-system
  datasource:
    url: jdbc:h2:mem:kuet_ums;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
